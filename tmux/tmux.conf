# --- Prefix Key -----------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General Settings -----------------------
set -g mouse on
set-window-option -g mode-keys vi
set -g base-index 1
set -g pane-base-index 1
set -g focus-events on

# --- Status Bar -----------------------------
set -g status-position bottom
set -g status-style 'bg=#13161d fg=#8b949e'
set -g status-left '#[fg=#00e68a,bold] #S #[fg=#30363d]│ '
set -g status-right '#[fg=#30364d]│#[fg=#8b949e] %H:%M #[fg=#30363d]│#[fg=#8b949e] %b %d '

# --- Terminal Colors ------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",xterm-256color:RGB"

# --- Pane Borders ---------------------------
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# --- Splits / New Windows -------------------
# Inherit the current pane's cwd instead of the session start directory
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# --- Pane Navigation ------------------------
# vi-style directional movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane Resizing --------------------------
# vim-style pane resizing
bind -r H resize-pane -L 7
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Lazygit --------------------------------
# Ephemeral popup rather than a persistent pane: the target repo follows the
# current pane's cwd, which a long-lived pane could not track.
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

