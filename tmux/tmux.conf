# --- Prefix Key -----------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- General Settings -----------------------
set -g mouse on
set-window-option -g mode-keys vi
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g focus-events on

# --- Status Bar -----------------------------
set -g status-style 'bg=default fg=#8b949e'
set -g status-position top
set -g status-left ' #[bold]#S │'
set -g status-left-length 50
set -g status-right "" 

# Window status
setw -g window-status-format ' #W '
setw -g window-status-current-format '#[fg=#00e68a] #W '

# --- Terminal Colors ------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -as terminal-features ",xterm-256color:RGB"

# --- Pane Borders ---------------------------
set -g pane-border-style "fg=#30364d"
set -g pane-active-border-style "fg=#00e68a"

# --- Splits / New Windows -------------------
# Inherit the current pane's cwd instead of the session start directory
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

# --- Pane Navigation ------------------------
# vi-style directional movement
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane Resizing --------------------------
# vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Lazygit --------------------------------
# Ephemeral popup rather than a persistent pane: the target repo follows the
# current pane's cwd, which a long-lived pane could not track.
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "lazygit"

# Aggressive resize for multi-client
setw -g aggressive-resize on

# Reload config
bind r source-file ~/.tmux.conf

# --- Appearance -----------------------------
# Window status
setw -g window-status-format ' #W '
setw -g window-status-current-format '#[fg=#00e68a] #W '

# --- TPM Plugin Manager ---------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
